name: Weekly social-media screening

# Negative / adverse-media screening for the alliance program.
# Runs weekly, pushes findings to Slack, and commits the CSV workbook back
# to the repo so it grows into a running log.
#
# Setup (one-time):
#   1. Settings → Secrets and variables → Actions → New repository secret
#        SLACK_WEBHOOK_URL   = your Slack incoming webhook URL
#      Optional, only if you enable the Twitter source:
#        TWITTER_AUTH_TOKEN  = burner-account cookie
#        TWITTER_CT0         = burner-account cookie
#   2. Commit a watchlist.yaml at the repo root (agent-reach screen init).
#
# Note: the cookie-auth sources (Reddit, Twitter) need a logged-in backend
# that is awkward to run in CI. The Exa (news/web) source needs no account
# and runs cleanly here — start with that, add the social sources once you
# have burner credentials wired in.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # to commit the updated CSV workbook

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node (for mcporter / Exa)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Agent Reach + Exa search backend
        run: |
          pip install -e .
          npm install -g mcporter
          mcporter config add exa https://mcp.exa.ai/mcp || true

      - name: Run screening
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          agent-reach screen run \
            --watchlist watchlist.yaml \
            --csv screening/findings.csv \
            --state screening/seen.json

      - name: Commit updated workbook + dedup state
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add screening/findings.csv screening/seen.json
          if git diff --staged --quiet; then
            echo "No new findings to commit."
          else
            git commit -m "chore(screening): weekly findings update"
            git push
          fi
