<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Barbecue Chuck Roast — How-To</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
         background: #14110f; color: #f4efe9; }
  header { padding: 20px 24px; background: #1e1a16; border-bottom: 1px solid #2c2722; }
  h1 { margin: 0; font-size: 22px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  .col { flex: 1 1 340px; min-width: 300px; }
  .reel { width: 100%; height: 640px; border-radius: 14px; background: #000; }
  .noreel { color: #998f82; }
  .stage { background: #1e1a16; border: 1px solid #2c2722; border-radius: 14px;
            padding: 28px; min-height: 260px; display: flex; flex-direction: column; }
  .counter { color: #d98a3d; font-weight: 600; letter-spacing: .04em; font-size: 13px; }
  .step { font-size: 26px; line-height: 1.45; margin: 16px 0 auto; }
  .bar { height: 4px; background: #2c2722; border-radius: 2px; margin-top: 20px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #d98a3d; transition: width .25s linear; }
  .controls { display: flex; gap: 10px; margin-top: 18px; }
  button { flex: 1; padding: 12px; font-size: 15px; border: 0; border-radius: 9px;
            background: #2c2722; color: #f4efe9; cursor: pointer; }
  button.primary { background: #d98a3d; color: #14110f; font-weight: 700; }
  button:hover { filter: brightness(1.12); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: #998f82; }
  ul { padding-left: 20px; line-height: 1.7; }
</style>
</head>
<body>
<header><h1>🍳 Japanese Barbecue Chuck Roast</h1></header>
<div class="wrap">
  <div class="col"><iframe class="reel" src="https://www.instagram.com/reel/DXsZah1EXd1/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>
  <div class="col">
    <div class="stage">
      <div class="counter" id="counter"></div>
      <div class="step" id="step"></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="controls">
        <button id="prev">‹ Prev</button>
        <button id="play" class="primary">▶ Play</button>
        <button id="next">Next ›</button>
      </div>
    </div>
    <h2>Ingredients</h2>
    <ul><li>3–4 lb chuck roast</li><li>2 tsp kosher salt</li><li>1 tsp pepper</li><li>2 tsp garlic powder</li><li>2 tsp onion powder</li><li>2 tbsp oil (olive or avocado)</li><li>1 cup beef broth</li><li>1–2 cups Japanese-style BBQ sauce</li></ul>
  </div>
</div>
<script>
const steps = [
    {"text": "Combine the seasonings and distribute evenly across both sides of the roast.", "secs": 5},
    {"text": "Heat the oil in a 12-inch skillet over high heat. Sear the roast 4\u20135 minutes per side until golden brown.", "secs": 8},
    {"text": "Transfer the seared meat to a 6-quart slow cooker (or Dutch oven).", "secs": 5},
    {"text": "Pour the broth into the hot skillet and simmer 60 seconds, scraping up the browned bits. Pour over the meat.", "secs": 8},
    {"text": "Cook on low 8\u201310 hours (or high 4\u20134.5 hours) until the meat falls apart easily. (Dutch oven: braise covered at 325\u00b0F for ~3\u00bd hours.)", "secs": 10},
    {"text": "Remove the meat; discard large fat chunks and the cooking liquid.", "secs": 5},
    {"text": "Shred the meat into bite-sized pieces and return it to the pot.", "secs": 5},
    {"text": "Add 1\u20132 cups Japanese BBQ sauce, stir, and cook on low 15\u201330 minutes to warm through.", "secs": 6},
    {"text": "Serve over rice with your sides of choice.", "secs": 5}
];
let i = 0, playing = false, timer = null, t0 = 0, raf = null;
const stepEl = document.getElementById('step');
const counterEl = document.getElementById('counter');
const fillEl = document.getElementById('fill');
const playBtn = document.getElementById('play');
function render() {
  stepEl.textContent = steps[i].text;
  counterEl.textContent = 'STEP ' + (i + 1) + ' / ' + steps.length;
  fillEl.style.width = '0%';
}
function tickBar() {
  const pct = Math.min(100, ((Date.now() - t0) / (steps[i].secs * 1000)) * 100);
  fillEl.style.width = pct + '%';
  if (playing) raf = requestAnimationFrame(tickBar);
}
function schedule() {
  clearTimeout(timer); cancelAnimationFrame(raf);
  t0 = Date.now(); tickBar();
  timer = setTimeout(() => {
    if (i < steps.length - 1) { i++; render(); schedule(); }
    else { stop(); }
  }, steps[i].secs * 1000);
}
function play() { playing = true; playBtn.textContent = '⏸ Pause'; schedule(); }
function stop() { playing = false; playBtn.textContent = '▶ Play';
  clearTimeout(timer); cancelAnimationFrame(raf); }
playBtn.onclick = () => playing ? stop() : play();
document.getElementById('next').onclick = () => {
  if (i < steps.length - 1) { i++; render(); if (playing) schedule(); } };
document.getElementById('prev').onclick = () => {
  if (i > 0) { i--; render(); if (playing) schedule(); } };
render();
</script>
</body>
</html>
